<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Trak | Base de donnees Grues Mobiles</title>
<link rel="stylesheet" href="css/style.css?v=172">
<link rel="stylesheet" href="css/admin.css?v=156">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Reuse exactly the same db-* styles as database.html */
.selector-section { max-width: 100% !important; padding: 0.5rem 1.5rem !important; }
.db-controls {
    display: flex; flex-wrap: wrap;
    gap: 0.5rem; margin-bottom: 0.75rem; align-items: flex-end;
}
.db-control-group { display: flex; flex-direction: column; gap: 0.25rem; }
.db-control-group label {
    font-size: 0.7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; color: #999;
}
.db-control-group select, .db-control-group input {
    padding: 8px 12px; background: var(--bg-input, #1a2332);
    border: 1px solid var(--border, #2a3a4a); border-radius: 6px;
    color: #fff; font-size: 0.85rem; min-width: 160px;
}
.db-search { min-width: 250px !important; }
.db-stats { color: #999; font-size: 0.8rem; margin-bottom: 1rem; }
.db-stats strong { color: #00CC66; }
.db-table-wrap {
    overflow: auto; border-radius: 8px;
    border: 1px solid var(--border, #2a3a4a);
    max-height: 75vh;
}
.db-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.db-table thead th {
    background: #1a2a3a; color: #fff;
    padding: 10px 12px; text-align: left;
    font-weight: 700; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.5px;
    position: sticky; top: 0; z-index: 10;
    cursor: pointer; user-select: none;
    white-space: nowrap;
}
.db-table thead th:hover { background: #243a4f; }
.db-table thead th .sort-arrow { margin-left: 4px; opacity: 0.3; }
.db-table thead th.sorted .sort-arrow { opacity: 1; color: #00CC66; }
.db-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
.db-table tbody tr:hover { background: rgba(0,100,200,0.1); }
.db-table tbody td { padding: 8px 12px; color: #ccc; white-space: nowrap; font-size: 0.8rem; }
.db-fixed-col {
    padding: 4px 6px !important;
    font-size: 0.78rem;
    white-space: nowrap;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.db-modele-year {
    color: #888;
    font-size: 0.75rem;
    font-weight: 500;
    margin-left: 0.2rem;
}
.db-note-dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #2a2a2a;
    border: 1px solid #444;
    cursor: help;
    transition: all 0.2s;
}
.db-note-dot.has-note {
    background: #00CC66;
    border-color: #00CC66;
    box-shadow: 0 0 6px rgba(0,204,102,0.6);
}
.flag-btn {
    background: transparent; border: none; cursor: pointer;
    font-size: 1rem; padding: 2px 4px; border-radius: 3px;
    opacity: 0.2; transition: transform 0.15s;
}
.flag-btn:hover { opacity: 0.7; transform: scale(1.2); }
.db-table tbody td:first-child { font-weight: 600; color: #fff; }
.db-table thead th:nth-child(1), .db-table tbody td:nth-child(1) {
    position: sticky; left: 0; z-index: 5; background: #1a2a3a;
}
.db-table thead th:nth-child(2), .db-table tbody td:nth-child(2) {
    position: sticky; left: 110px; z-index: 5; background: #1a2a3a;
}
.db-table thead th:nth-child(1), .db-table thead th:nth-child(2) { z-index: 15; }
.db-table tbody tr:hover td:nth-child(1), .db-table tbody tr:hover td:nth-child(2) {
    background: #1e3450;
}
.db-export-btn {
    padding: 8px 16px; background: #0062CC; color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.8rem; font-weight: 600;
}
.db-export-btn:hover { background: #004A99; }
.db-modele-link {
    color: #4FC3F7; font-weight: 600;
    border-bottom: 1px dashed rgba(79,195,247,0.4);
}
.db-modele-link:hover { color: #FFB74D; border-bottom-color: #FFB74D; }
.intro-row {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
}
.section-title {
    font-size: 1.15rem; font-weight: 700; color: var(--text-primary);
}
.preview-badge {
    background: #FFB74D; color: #1a1a1a;
    font-size: 0.6rem; font-weight: 800;
    padding: 3px 8px; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 1px;
}
.preview-sub { color: #888; font-size: 0.8rem; margin-left: auto; }
/* Chips */
.chip { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.66rem; font-weight: 700; border: 1px solid #444; }
.chip.AT { color: #4DA8FF; border-color: #4DA8FF55; background: #4DA8FF15; }
.chip.RT { color: #FFD600; border-color: #FFD60055; background: #FFD60015; }
.chip.TM { color: #FF8A4D; border-color: #FF8A4D55; background: #FF8A4D15; }
.chip.CT { color: #B45CFF; border-color: #B45CFF55; background: #B45CFF15; }
.chip.CL { color: #FF6B9D; border-color: #FF6B9D55; background: #FF6B9D15; }
.chip.IN { color: #00CC66; border-color: #00CC6655; background: #00CC6615; }
.chip.MI { color: #FFB347; border-color: #FFB34755; background: #FFB34715; }
.mode-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: rgba(77,168,255,0.1); color: #4DA8FF; border: 1px solid rgba(77,168,255,0.3); }
.mode-tag.telematik { background: rgba(180,92,255,0.1); color: #B45CFF; border-color: rgba(180,92,255,0.3); }
.mode-tag.twin { background: rgba(255,138,77,0.1); color: #FF8A4D; border-color: rgba(255,138,77,0.3); }
.mode-tag.mega { background: rgba(0,204,102,0.1); color: #00CC66; border-color: rgba(0,204,102,0.3); }
.mode-tag.na { background: rgba(120,120,120,0.1); color: #888; border-color: rgba(120,120,120,0.3); }
.status-actif { color: #00CC66; font-weight: 600; }
.status-remplace { color: #FF6B6B; }
.status-discontinue { color: #888; font-style: italic; }
.status-limite { color: #FFD600; font-size: 0.74rem; }

/* ===== Responsive : mobile-view (auto via JS OU force via bouton) ===== */
body.mobile-view header { padding: 0 1rem !important; height: 60px !important; }
body.mobile-view .header-logo { height: 44px !important; }
body.mobile-view .header-back { padding: 4px 10px !important; font-size: 0.72rem !important; }
body.mobile-view main { padding: 0.75rem 0.5rem !important; }
body.mobile-view .selector-section { padding: 0.5rem 0.75rem !important; border-radius: 6px !important; }
body.mobile-view .intro-row { gap: 0.5rem !important; margin-bottom: 0.75rem !important; }
body.mobile-view .section-title { font-size: 0.95rem !important; }
body.mobile-view .preview-sub { display: none; }
body.mobile-view .db-controls {
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 0.5rem !important;
}
body.mobile-view .db-controls .db-control-group { min-width: 0 !important; }
body.mobile-view .db-controls .db-control-group:has(#db-search),
body.mobile-view .db-controls .db-control-group:has(#db-export) { grid-column: 1 / -1; }
body.mobile-view .db-control-group select,
body.mobile-view .db-control-group input { min-width: 0 !important; width: 100% !important; }
body.mobile-view .db-search { min-width: 0 !important; }
body.mobile-view .db-table { font-size: 0.74rem !important; }
body.mobile-view .db-table thead th { font-size: 0.6rem !important; padding: 5px 5px !important; height: 38px !important; }
body.mobile-view .db-table tbody td { padding: 5px 6px !important; font-size: 0.72rem !important; }
/* Hide Fabricant column on mobile, show it inline under Modele */
body.mobile-view .db-table thead th:nth-child(1),
body.mobile-view .db-table tbody td:nth-child(1) { display: none; }
body.mobile-view .db-table thead th:nth-child(2),
body.mobile-view .db-table tbody td:nth-child(2) {
    left: 0 !important; position: sticky;
    width: 110px !important; min-width: 110px !important; max-width: 110px !important;
    white-space: normal !important;
}
body.mobile-view .db-fab-mobile {
    display: block; font-size: 0.6rem; color: #9ca8b5;
    font-weight: 500; margin-top: 2px; line-height: 1.1;
}
.db-fab-mobile { display: none; }
body.mobile-view .db-table-wrap { -webkit-overflow-scrolling: touch; max-height: 70vh !important; }
body.mobile-view #edit-view .card { padding: 0.85rem !important; border-radius: 6px !important; }
body.mobile-view #edit-view .card-head { flex-direction: column; align-items: stretch; gap: 0.6rem; }
body.mobile-view #edit-view .card-head h2 { font-size: 0.92rem !important; }
body.mobile-view #edit-view .tabs.tabs-with-save {
    flex-direction: column; align-items: stretch !important; gap: 0.5rem;
    margin: 0 -0.85rem 1rem -0.85rem !important; padding: 0 0.85rem !important;
}
body.mobile-view #edit-view .tabs-buttons { width: 100%; }
body.mobile-view #edit-view .tab { flex: 1; padding: 0.6rem 0.5rem !important; font-size: 0.82rem !important; text-align: center; }
body.mobile-view #edit-view .tabs-save-group { width: 100%; justify-content: space-between; }
body.mobile-view #edit-view .tabs-save-group button { flex: 1; }
body.mobile-view #edit-view .spec-edit { grid-template-columns: 1fr !important; gap: 0.25rem !important; padding: 0.35rem 0 !important; }
body.mobile-view #edit-view .spec-edit label { font-size: 0.72rem; }
body.mobile-view #edit-view .btn-row { flex-direction: column; }
body.mobile-view #edit-view .btn-row button { width: 100%; }

body.narrow-view .db-controls { grid-template-columns: 1fr !important; }
body.narrow-view .db-controls .db-control-group:has(#db-search),
body.narrow-view .db-controls .db-control-group:has(#db-export) { grid-column: 1; }
body.narrow-view .header-back span { display: none; }
body.narrow-view .preview-badge { font-size: 0.55rem; padding: 2px 6px; }

/* Toggle button for forced mobile preview */
.view-toggle {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 5px 10px; border-radius: 6px;
    cursor: pointer; font-size: 0.74rem; font-weight: 600;
    font-family: inherit;
    display: inline-flex; align-items: center; gap: 4px;
}
.view-toggle:hover { background: rgba(255,255,255,0.12); }
.view-toggle.active { background: #FFB74D; color: #000; border-color: #FFB74D; }

/* Mobile preview frame â€” affichage simule d'un cellulaire */
body.force-mobile { background: #000; }
body.force-mobile main, body.force-mobile header, body.force-mobile .accent-bar {
    max-width: 414px; margin-left: auto; margin-right: auto;
    box-shadow: 0 0 0 1px #444, 0 0 20px rgba(0,0,0,0.7);
}
body.force-mobile header { border-radius: 14px 14px 0 0; }
body.force-mobile main { min-height: calc(100vh - 80px); border-radius: 0 0 14px 14px; }
.db-modele-link { cursor: pointer; }
/* ===== EDIT VIEW (style: edit-machine.html des excavatrices) ===== */
#edit-view { display: none; }
#edit-view.open { display: block; }
#edit-view .card {
    background: #2A2A2A; border: 1px solid #3A3A3A;
    border-radius: 8px; padding: 1.5rem;
}
#edit-view .card-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    border-bottom: 1px solid #3A3A3A; padding-bottom: 0.75rem; margin-bottom: 1rem;
}
#edit-view .card-head h2 { font-size: 1.05rem; font-weight: 600; color: #F0F0F0; }
#edit-view .card-head .meta { color: #A0A0A0; font-weight: 400; margin-left: 0.5rem; }
#edit-view .head-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
#edit-view .tabs {
    display: flex; gap: 0; border-bottom: 1px solid #3A3A3A;
    margin-bottom: 1.25rem; flex-wrap: wrap;
}
#edit-view .tabs.tabs-with-save {
    justify-content: space-between; align-items: center;
    background: linear-gradient(180deg,#2A2A2A,rgba(42,42,42,0.97));
    margin: 0 -1.5rem 1.25rem -1.5rem; padding: 0 1.5rem;
}
#edit-view .tabs-buttons { display: flex; gap: 0; }
#edit-view .tab {
    padding: 0.75rem 1.25rem; background: transparent; color: #A0A0A0;
    border: none; border-bottom: 2px solid transparent; cursor: pointer;
    font-family: inherit; font-size: 0.9rem; font-weight: 500; border-radius: 0;
}
#edit-view .tab.active { color: #0062CC; border-bottom-color: #0062CC; }
#edit-view .tab:hover { color: #F0F0F0; }
#edit-view .tabs-save-group { display: flex; gap: 0.5rem; align-items: center; padding: 0.4rem 0; }
#edit-view #btn-save-top {
    background: linear-gradient(135deg,#00CC66,#00AA55); color: #000;
    padding: 0.5rem 1rem; font-weight: 700; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.88rem;
    box-shadow: 0 2px 6px rgba(0,204,102,0.25);
}
#edit-view #btn-save-top:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,204,102,0.4); }
#edit-view #btn-save-top:disabled { background: #3a3a3a; color: #666; cursor: not-allowed; box-shadow: none; }
#edit-view #btn-reset-top {
    background: transparent; color: #A0A0A0; border: 1px solid #3A3A3A;
    padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem;
}
#edit-view #btn-reset-top:hover:not(:disabled) { background: #333; color: #F0F0F0; }
#edit-view .specs-edit {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 0.6rem 1.2rem;
}
@media (max-width:768px) { #edit-view .specs-edit { grid-template-columns: 1fr; } }
#edit-view .spec-edit {
    display: grid; grid-template-columns: 1fr 1.2fr; align-items: center; gap: 0.6rem;
    padding: 0.45rem 0; border-bottom: 1px dashed #2f2f2f; font-size: 0.88rem;
}
#edit-view .spec-edit label { color: #A0A0A0; }
#edit-view .spec-edit input, #edit-view .spec-edit select {
    background: #1E1E1E; color: #F0F0F0; border: 1px solid #3A3A3A;
    border-radius: 5px; padding: 0.4rem 0.55rem; font-size: 0.85rem;
    font-family: inherit; width: 100%;
}
#edit-view .spec-edit input:focus, #edit-view .spec-edit select:focus { outline: none; border-color: #0062CC; }
#edit-view .spec-edit.changed input, #edit-view .spec-edit.changed select {
    border-color: #0062CC; background: rgba(0,98,204,0.08);
}
#edit-view .notes-area {
    width: 100%; min-height: 100px; resize: vertical;
    background: #1E1E1E; color: #F0F0F0; border: 1px solid #3A3A3A;
    border-radius: 6px; padding: 0.55rem 0.7rem; font-size: 0.9rem; font-family: inherit;
}
#edit-view .notes-area:focus { outline: none; border-color: #0062CC; }
#edit-view .btn-row { display: flex; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }
#edit-view .btn-row button {
    background: #0062CC; color: #fff; border: none; border-radius: 6px;
    padding: 0.7rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
}
#edit-view .btn-row button:hover:not(:disabled) { background: #0073EF; }
#edit-view .btn-row button.secondary {
    background: transparent; border: 1px solid #3A3A3A; color: #F0F0F0;
}
#edit-view .btn-row button.secondary:hover { background: #333; }
#edit-view .btn-row button:disabled { opacity: 0.4; cursor: not-allowed; }
#edit-view .notes-label {
    display: block; font-size: 0.75rem; color: #A0A0A0;
    margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;
}
.edited-badge {
    background: #FFB74D; color: #000;
    font-size: 0.55rem; font-weight: 800;
    padding: 1px 5px; border-radius: 3px;
    margin-left: 6px; vertical-align: middle;
    text-transform: uppercase; letter-spacing: 0.5px;
}
.db-toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #00CC66; color: #001a0a;
    padding: 10px 22px; border-radius: 22px;
    font-size: 0.82rem; font-weight: 700;
    z-index: 10001; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    animation: toastFade 2.4s forwards;
}
@keyframes toastFade { 0%,75% { opacity:1 } 100% { opacity:0 } }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <a href="index.html" class="header-back" title="Page precedente">&larr; <span>Retour</span></a>
    <div class="logo-section">
      <img src="assets/logo-white.png" alt="e-Trak | GRYB" class="header-logo">
    </div>
  </div>
</header>
<div class="accent-bar"></div>

<main>
  <section class="selector-section" id="db-view">

    <div class="intro-row">
      <span class="section-title">Base de donnees Grues Mobiles</span>
      <span class="preview-badge" style="background:#00CC66;color:#001a0a">Beta</span>
      <span class="preview-sub">Amerique du Nord &middot; 2015 - 2026</span>
      <button id="view-mobile-toggle" class="view-toggle" title="Forcer l'affichage cellulaire" style="margin-left:auto;">&#128241; Apercu mobile</button>
    </div>

    <div class="db-controls">
      <div class="db-control-group">
        <label>Type</label>
        <select id="db-type"><option value="">Tous</option></select>
      </div>
      <div class="db-control-group">
        <label>Fabricant</label>
        <select id="db-fab"><option value="">Tous</option></select>
      </div>
      <div class="db-control-group">
        <label>Annee</label>
        <select id="db-annee"><option value="">Toutes</option></select>
      </div>
      <div class="db-control-group">
        <label>Recherche</label>
        <input type="text" id="db-search" class="db-search" placeholder="Rechercher un modele...">
      </div>
      <div class="db-control-group">
        <label>&nbsp;</label>
        <button id="db-export" class="db-export-btn">&#128196; Exporter CSV</button>
      </div>
    </div>

    <div id="db-stats" class="db-stats"></div>

    <div class="db-table-wrap">
      <table class="db-table" id="db-table">
        <thead>
          <tr id="hdr-row"></tr>
        </thead>
        <tbody id="db-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- Edit view (sibling of db-view, swapped in/out) -->
  <section id="edit-view">
  <div class="card">
    <div class="card-head">
      <h2 id="ev-title">Editer la machine</h2>
      <div class="head-actions">
        <button class="secondary" id="ev-back" style="background:transparent;border:1px solid #3A3A3A;color:#F0F0F0;border-radius:6px;padding:0.5rem 0.9rem;cursor:pointer;font-size:0.82rem;font-family:inherit;">&larr; Retour BD</button>
      </div>
    </div>
    <div class="tabs tabs-with-save">
      <div class="tabs-buttons">
        <button class="tab active" data-tab="specs">Specifications</button>
        <button class="tab" data-tab="notes">Notes</button>
      </div>
      <div class="tabs-save-group">
        <button id="btn-reset-top" disabled>Annuler chgmt</button>
        <button id="btn-save-top" disabled>&#128190; Sauvegarder</button>
      </div>
    </div>

    <div id="tab-specs">
      <div class="specs-edit" id="specs-edit-grid"></div>
    </div>

    <div id="tab-notes" style="display:none">
      <label class="notes-label">Notes sur ce modele</label>
      <textarea id="ev-notes" class="notes-area"></textarea>
    </div>

    <div class="btn-row">
      <button id="btn-save" disabled>&#128190; Sauvegarder</button>
      <button class="secondary" id="btn-reset" disabled>Annuler les changements</button>
    </div>
  </div>
</section>

<datalist id="ed-types"></datalist>
<datalist id="ed-modes"></datalist>
<datalist id="ed-statuts"></datalist>

const EDIT_STORAGE_KEY = 'grues_edits_v1';

function loadEdits() {
  try { return JSON.parse(localStorage.getItem(EDIT_STORAGE_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveEdits(edits) {
  localStorage.setItem(EDIT_STORAGE_KEY, JSON.stringify(edits));
}
function rowId(r) {
  // Stable identifier: original Fabricant + Modele + Annee intro
  return (r._origFab || r['Fabricant']) + '||' + (r._origMod || r['Modele']) + '||' + (r._origYear || r['Annee intro']);
}
let EDITS = loadEdits();

function applyEdits() {
  const merged = ORIGINAL.map(r => {
    const o = Object.assign({}, r);
    o._origFab = r['Fabricant'];
    o._origMod = r['Modele'];
    o._origYear = r['Annee intro'];
    const id = rowId(o);
    if (EDITS[id]) {
      Object.assign(o, EDITS[id]);
      o._edited = true;
    }
    return o;
  });
  return merged;
}
// Expand each model into one row per year sold (intro..fin or current year)
const PORTAL_MIN_YEAR = 2015;
const PORTAL_MAX_YEAR = 2026;
function expandByYear(models) {
  const out = [];
  models.forEach(m => {
    const intro = parseInt(m['Annee intro']||'0', 10);
    const finRaw = (m['Annee fin']||'').toString().trim();
    let fin = finRaw ? parseInt(finRaw, 10) : PORTAL_MAX_YEAR;
    if (!intro) { out.push(Object.assign({}, m, {Annee:''})); return; }
    const y1 = Math.max(intro, PORTAL_MIN_YEAR);
    const y2 = Math.min(fin || PORTAL_MAX_YEAR, PORTAL_MAX_YEAR);
    if (y1 > y2) {
      out.push(Object.assign({}, m, {Annee:String(intro)}));
      return;
    }
    for (let y = y1; y <= y2; y++) {
      out.push(Object.assign({}, m, {Annee:String(y)}));
    }
  });
  return out;
}
let DATA = expandByYear(applyEdits());

const COLS = [
  {key:'Fabricant', label:'Fabricant', w:'110px'},
  {key:'Modele', label:'Modele', w:'130px'},

];
let sortKey = 'Fabricant', sortAsc = true;

function typeChip(t) {
  if (!t) return '';
  if (t.indexOf('All-Terrain')===0) return '<span class="chip AT">AT</span>';
  if (t.indexOf('Rough-Terrain')===0) return '<span class="chip RT">RT</span>';
  if (t.indexOf('Truck-Mounted')===0) return '<span class="chip TM">'+(t.indexOf('Boom')!==-1?'BT':'TM')+'</span>';
  if (t.indexOf('Crawler telescopique')===0) return '<span class="chip CT">CT</span>';
  if (t.indexOf('Crawler treillis')===0) return '<span class="chip CL">CL</span>';
  if (t.indexOf('Industriel')===0) return '<span class="chip IN">IND</span>';
  if (t.indexOf('Mini')===0) return '<span class="chip MI">MINI</span>';
  if (t.indexOf('Truck Crane')===0) return '<span class="chip TM">TC</span>';
  return t;
}
function statusCls(s) {
  if (!s) return '';
  if (s.indexOf('Actif limite')!==-1) return 'status-limite';
  if (s.indexOf('Actif')===0) return 'status-actif';
  if (s.indexOf('Remplace')===0) return 'status-remplace';
  if (s.indexOf('Discontinue')===0) return 'status-discontinue';
  return '';
}
function modeTag(m) {
  if (!m) return '';
  if (m.indexOf('N/A')===0) return '<span class="mode-tag na">N/A treillis</span>';
  if (m.indexOf('Telematik')!==-1) return '<span class="mode-tag telematik">Telematik</span>';
  if (m.indexOf('TWIN')!==-1) return '<span class="mode-tag twin">Twin pinning</span>';
  if (m.indexOf('MEGAFORM')!==-1) return '<span class="mode-tag mega">MEGAFORM</span>';
  if (m.indexOf('Proportionnel')===0) return '<span class="mode-tag">Proportionnel</span>';
  return m;
}
function uniq(arr) { return [...new Set(arr)].filter(x=>x && x.trim()).sort(); }

function buildFilters() {
  const f = (id, key) => {
    const sel = document.getElementById(id);
    uniq(DATA.map(r=>r[key])).forEach(v=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = v; sel.appendChild(o);
    });
  };
  f('db-type','Type de grue');
  f('db-fab','Fabricant');
  const years = uniq(DATA.map(r=>r['Annee'])).reverse();
  const ya = document.getElementById('db-annee');
  years.forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v; ya.appendChild(o);
  });
}

function buildHeader() {
  const hr = document.getElementById('hdr-row');
  hr.innerHTML = '';
  COLS.forEach(c=>{
    const th = document.createElement('th');
    if (c.w) { th.style.width = c.w; th.style.minWidth = c.w; th.style.maxWidth = c.w; }
    if (c.center) th.style.textAlign = 'center';
    th.innerHTML = c.label + ' <span class="sort-arrow">&#9650;</span>';
    th.onclick = ()=>{
      const sk = c.sortBy || c.key;
      if (sortKey===sk) sortAsc=!sortAsc; else { sortKey=sk; sortAsc=true; }
      [...hr.children].forEach(x=>{ x.classList.remove('sorted'); x.querySelector('.sort-arrow').innerHTML='&#9650;'; });
      th.classList.add('sorted');
      th.querySelector('.sort-arrow').innerHTML = sortAsc ? '&#9650;' : '&#9660;';
      render();
    };
    hr.appendChild(th);
  });
}

function render() {
  const typ = document.getElementById('db-type').value;
  const fab = document.getElementById('db-fab').value;
  const yr  = document.getElementById('db-annee').value;
  const s   = document.getElementById('db-search').value.toLowerCase();

  let rows = DATA.filter(r=>{
    if (typ && r['Type de grue']!==typ) return false;
    if (fab && r['Fabricant']!==fab) return false;
    if (yr && String(r['Annee'])!==yr) return false;
    if (s) {
      const blob = Object.values(r).join(' ').toLowerCase();
      if (blob.indexOf(s) === -1) return false;
    }
    return true;
  });

  if (sortKey) {
    rows.sort((a,b)=>{
      const A=a[sortKey]||'', B=b[sortKey]||'';
      const nA=parseFloat(A), nB=parseFloat(B);
      const isNum = !isNaN(nA) && !isNaN(nB) && A!=='' && B!=='';
      const cmp = isNum ? (nA-nB) : String(A).localeCompare(String(B));
      return sortAsc ? cmp : -cmp;
    });
  }

  const tb = document.getElementById('db-tbody');
  tb.innerHTML = '';
  if (rows.length === 0) {
    tb.innerHTML = '<tr><td colspan="'+COLS.length+'" style="padding:30px;text-align:center;color:#666;">Aucun modele ne correspond aux filtres.</td></tr>';
  } else {
    const frag = document.createDocumentFragment();
    rows.forEach(r=>{
      const tr = document.createElement('tr');
      COLS.forEach(c=>{
        const td = document.createElement('td');
        let v = r[c.key]||'';
        if (c.key==='__capacite__') {
          const us = r['Capacite max (US t)']||'';
          const mt = r['Capacite max (t metrique)']||'';
          if (!us && !mt) td.textContent = 'â€”';
          else td.innerHTML = '<span style="color:#fff;font-weight:600">'+us+'</span> <span style="color:#888">/</span> <span style="color:#bbb">'+mt+'</span>';
        }
        else if (c.key==='__boom__') {
          const pi = r['Longueur max boom (pi)']||'';
          const m  = r['Longueur max boom (m)']||'';
          const isZero = (pi==='0' || pi==='0.0') && (m==='0' || m==='0.0');
          if (isZero || (!pi && !m)) td.textContent = 'â€”';
          else td.innerHTML = '<span style="color:#fff;font-weight:600">'+pi+'</span> <span style="color:#888">/</span> <span style="color:#bbb">'+m+'</span>';
        }
        else if (c.key==='Modele') {
          td.className = 'db-fixed-col';
          const link = document.createElement('a');
          link.className = 'db-modele-link';
          link.href = 'javascript:void(0)';
          link.textContent = v;
          link.title = 'Editer ' + (r['Fabricant']||'') + ' ' + v + ' (' + (r['Annee']||'') + ')';
          link.onclick = (e) => { e.preventDefault(); openEditView(r); };
          td.appendChild(link);
          const yearSpan = document.createElement('span');
          yearSpan.className = 'db-modele-year';
          yearSpan.textContent = ' ' + (r['Annee']||'');
          td.appendChild(yearSpan);
          if (r._edited) {
            const b = document.createElement('span');
            b.className = 'edited-badge'; b.textContent = 'Edite';
            td.appendChild(b);
          }
          // Fabricant inline for mobile (hidden by CSS on desktop)
          const fabSub = document.createElement('div');
          fabSub.className = 'db-fab-mobile';
          fabSub.textContent = r['Fabricant'] || '';
          td.appendChild(fabSub);
        }
        else if (c.key==='Fabricant') {
          td.className = 'db-fixed-col';
          td.textContent = v;
        }
        else if (c.key==='__notes__') {
          const dot = document.createElement('span');
          dot.className = 'db-note-dot' + ((r['Notes']||'').trim() ? ' has-note' : '');
          dot.title = (r['Notes']||'').trim() || 'Aucune note';
          td.style.textAlign = 'center';
          td.appendChild(dot);
        }
        else if (c.key==='__flag__') {
          td.style.textAlign = 'center';
          td.style.fontSize = '0.9rem';
          const btn = document.createElement('button');
          btn.className = 'flag-btn';
          btn.textContent = 'ðŸš©';
          btn.title = 'Drapeau (a venir)';
          td.appendChild(btn);
        }
        else if (c.key==='Type de grue') { td.innerHTML = typeChip(v); td.title = v; }
        else td.textContent = v;
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tb.appendChild(frag);
  }
  document.getElementById('db-stats').innerHTML = '<strong>'+rows.length+'</strong> modeles affiches sur <strong>'+DATA.length+'</strong>';
}

let editDraft = {};      // Pending changes for current row
const SPEC_FIELDS = [

  {key:'Modele',                     label:'Modele',             type:'text'},

function populateDatalists() {
  const dl = (id, key) => {
    const el = document.getElementById(id);
    el.innerHTML = '';
    uniq(ORIGINAL.map(r=>r[key])).forEach(v=>{
      const o = document.createElement('option'); o.value = v; el.appendChild(o);
    });

  dl('ed-types','Type de grue');

function getOriginalFor(row) {
  return ORIGINAL.find(o => o['Fabricant']===row._origFab && o['Modele']===row._origMod && o['Annee intro']===row._origYear) || row;
}

function buildSpecsGrid(row) {
  const grid = document.getElementById('specs-edit-grid');
  grid.innerHTML = '';
  const orig = getOriginalFor(row);
  SPEC_FIELDS.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'spec-edit';
    wrap.dataset.key = f.key;
    const lab = document.createElement('label');
    lab.textContent = f.label;
    const inp = document.createElement('input');
    inp.type = f.type;
    if (f.step) inp.step = f.step;
    if (f.list) inp.setAttribute('list', f.list);
    inp.value = row[f.key] != null ? row[f.key] : '';
    inp.dataset.original = orig[f.key] != null ? orig[f.key] : '';
    inp.addEventListener('input', () => {
      editDraft[f.key] = inp.value;
      const changed = String(inp.value) !== String(inp.dataset.original);
      wrap.classList.toggle('changed', changed);
      refreshDirty();
    });
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    if (String(inp.value) !== String(inp.dataset.original)) wrap.classList.add('changed');
    grid.appendChild(wrap);
  });
}

function refreshDirty() {
  const orig = getOriginalFor(currentEditRow);
  const notes = document.getElementById('ev-notes').value;
  let n = 0;
  if (String(notes) !== String(orig['Notes']||'')) n++;
  SPEC_FIELDS.forEach(f => {
    const v = editDraft[f.key];
    if (v !== undefined && String(v) !== String(orig[f.key]||'')) n++;
  });
  const dis = n === 0;
  ['btn-save','btn-save-top','btn-reset','btn-reset-top'].forEach(id => {
    document.getElementById(id).disabled = dis;
  });
  document.getElementById('btn-save').innerHTML = '&#128190; Sauvegarder' + (n>0?' ('+n+' chgmt)':'');
  document.getElementById('btn-save-top').innerHTML = '&#128190; Sauvegarder' + (n>0?' ('+n+')':'');
}

function openEditView(r) {
  currentEditRow = r;
  editDraft = {};
  const title = 'Editer : ' + r['Fabricant'] + ' ' + r['Modele'];
  const meta = ' <span class="meta">(' + (r['Annee intro']||'') + ' &middot; ' + (r['Type de grue']||'') + ')</span>';
  document.getElementById('ev-title').innerHTML = title + meta;
  buildSpecsGrid(r);
  document.getElementById('ev-notes').value = r['Notes'] || '';
  document.getElementById('ev-notes').oninput = () => refreshDirty();
  // Switch view
  document.getElementById('db-view').style.display = 'none';
  document.getElementById('edit-view').classList.add('open');
  // Activate Specs tab by default
  document.querySelectorAll('#edit-view .tab').forEach(t => t.classList.toggle('active', t.dataset.tab==='specs'));
  document.getElementById('tab-specs').style.display = 'block';
  document.getElementById('tab-notes').style.display = 'none';
  refreshDirty();
  window.scrollTo(0,0);
}

function closeEditView() {
  document.getElementById('edit-view').classList.remove('open');
  document.getElementById('db-view').style.display = '';
  currentEditRow = null; editDraft = {};
}

function saveEditView() {
  if (!currentEditRow) return;
  const id = rowId(currentEditRow);
  const orig = getOriginalFor(currentEditRow);
  const patch = {};
  SPEC_FIELDS.forEach(f => {
    const v = editDraft[f.key];
    if (v !== undefined && String(v) !== String(orig[f.key]||'')) patch[f.key] = v;
  });
  const notesVal = document.getElementById('ev-notes').value;
  if (String(notesVal) !== String(orig['Notes']||'')) patch['Notes'] = notesVal;
  if (Object.keys(patch).length === 0) { closeEditView(); return; }
  EDITS[id] = Object.assign(EDITS[id] || {}, patch);
  saveEdits(EDITS);
  DATA = expandByYear(applyEdits());
  rebuildFilters();
  render();
  closeEditView();
  showToast('Modifications sauvegardees (' + Object.keys(EDITS).length + ' machine(s) editee(s))');
}

function resetEditDraft() {
  if (!currentEditRow) return;
  editDraft = {};
  buildSpecsGrid(currentEditRow);
  const orig = getOriginalFor(currentEditRow);
  document.getElementById('ev-notes').value = orig['Notes'] || '';
  refreshDirty();
}

function showToast(msg) {
  const old = document.querySelector('.db-toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'db-toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

document.getElementById('ev-back').onclick = closeEditView;

// Tab switching
document.querySelectorAll('#edit-view .tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#edit-view .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const t = btn.dataset.tab;
    document.getElementById('tab-specs').style.display = t==='specs' ? 'block' : 'none';
    document.getElementById('tab-notes').style.display = t==='notes' ? 'block' : 'none';
  });
});

document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape' && document.getElementById('edit-view').classList.contains('open')) closeEditView();
});

function rebuildFilters() {
  ['db-type','db-fab'].forEach(id=>{
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = '<option value="">Tous</option>';
    sel.dataset.preserve = cur;
  });
  const ya = document.getElementById('db-annee');
  const curYa = ya.value;
  ya.innerHTML = '<option value="">Toutes</option>';
  ya.dataset.preserve = curYa;
  const f = (id, key) => {
    const sel = document.getElementById(id);
    uniq(DATA.map(r=>r[key])).forEach(v=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = v; sel.appendChild(o);
    });
    if (sel.dataset.preserve) sel.value = sel.dataset.preserve;
  };
  f('db-type','Type de grue');
  f('db-fab','Fabricant');
  const years = uniq(DATA.map(r=>r['Annee'])).reverse();
  years.forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v; ya.appendChild(o);
  });
  if (ya.dataset.preserve) ya.value = ya.dataset.preserve;
}

document.getElementById('db-export').onclick = ()=>{
  const typ = document.getElementById('db-type').value;
  const fab = document.getElementById('db-fab').value;
  const yr  = document.getElementById('db-annee').value;
  const s   = document.getElementById('db-search').value.toLowerCase();
  let rows = DATA.filter(r=>{
    if (typ && r['Type de grue']!==typ) return false;
    if (fab && r['Fabricant']!==fab) return false;
    if (yr && String(r['Annee'])!==yr) return false;
    if (s) { const blob = Object.values(r).join(' ').toLowerCase(); if (blob.indexOf(s)===-1) return false; }
    return true;
  });
  const headers = COLS.map(c=>c.key);
  const csv = [headers.join(';')].concat(rows.map(r=>headers.map(h=>(r[h]||'').toString().replace(/;/g,',')).join(';'))).join('\r\n');
  const blob = new Blob(['ï»¿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Grues_Mobiles_export.csv';
  a.click();
};

buildFilters();
populateDatalists();
buildHeader();
['db-type','db-fab','db-annee','db-search'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});
render();

// ---- View-mode toggle: auto responsive + force-mobile button ----
const VIEW_KEY = 'grues_view_mobile_forced';
function syncViewMode() {
  const body = document.body;
  const forced = body.classList.contains('force-mobile');
  const w = window.innerWidth;
  body.classList.toggle('mobile-view', forced || w <= 768);
  body.classList.toggle('narrow-view', forced || w <= 480);
}
const viewBtn = document.getElementById('view-mobile-toggle');
function applyForcedView(on) {
  const body = document.body;
  body.classList.toggle('force-mobile', on);
  viewBtn.classList.toggle('active', on);
  viewBtn.innerHTML = on ? '&#128187; Vue desktop' : '&#128241; Apercu mobile';
  localStorage.setItem(VIEW_KEY, on ? '1' : '0');
  syncViewMode();
}
viewBtn.addEventListener('click', ()=> applyForcedView(!document.body.classList.contains('force-mobile')));
window.addEventListener('resize', syncViewMode);
applyForcedView(localStorage.getItem(VIEW_KEY) === '1');
</script>
