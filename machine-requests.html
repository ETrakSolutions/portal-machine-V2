<!DOCTYPE html>
<html lang="fr" data-i18n-title="doc.title_requests">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Trak | Nouvelles machines</title>
    <link rel="stylesheet" href="css/style.css?v=174">
    <link rel="stylesheet" href="css/admin.css?v=175">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .selector-section { max-width: 1100px; padding: 0.5rem 1.5rem; }
        .mr-intro { color: var(--text-secondary, #9fb0c0); font-size: 0.85rem; margin: 0.25rem 0 1rem; }
        .mr-card {
            background: var(--bg-card, #141d2b);
            border: 1px solid var(--border, #2a3a4a);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
        }
        .mr-card h2 { font-size: 1rem; margin: 0 0 0.75rem; color: #fff; }
        .mr-addrow { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
        .mr-field { display: flex; flex-direction: column; gap: 0.25rem; }
        .mr-field label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #8aa; }
        .mr-field input, .mr-field select {
            padding: 8px 11px; background: var(--bg-input, #1a2332);
            border: 1px solid var(--border, #2a3a4a); border-radius: 6px; color: #fff;
            font-size: 0.85rem; min-width: 150px;
        }
        .mr-btn {
            padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 0.82rem; font-weight: 700; color: #fff; background: #0062CC; transition: all 0.2s;
        }
        .mr-btn:hover { filter: brightness(1.1); }
        .mr-btn:disabled { opacity: 0.55; cursor: default; }
        .mr-btn-gen { background: #FF6A00; }
        .mr-btn-reject { background: transparent; border: 1px solid #555; color: #bbb; }
        .mr-btn-reject:hover { border-color: #CC0000; color: #ff6b6b; }
        table.mr-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.mr-table th, table.mr-table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border, #2a3a4a); }
        table.mr-table th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #8aa; }
        table.mr-table tr:hover td { background: rgba(0,98,204,0.06); }
        .mr-empty { color: #889; padding: 1rem; text-align: center; }
        .mr-actions { display: flex; gap: 0.4rem; white-space: nowrap; }
        .mr-toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #0062CC; color: #fff; padding: 10px 18px; border-radius: 8px;
            font-size: 0.85rem; z-index: 9999; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .mr-overlay {
            position: fixed; inset: 0; background: rgba(8,12,20,0.72); z-index: 10000;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
        }
        .mr-spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #FF6A00; border-radius: 50%; animation: mr-spin 0.9s linear infinite; }
        @keyframes mr-spin { to { transform: rotate(360deg); } }
        .mr-overlay-text { color: #fff; font-size: 0.95rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="header-back" title="Page precedente" data-i18n-title="common.back_page" onclick="if(history.length > 1){event.preventDefault();history.back();}">&larr; <span data-i18n="common.retour">Retour</span></a>
            <div class="logo-section">
                <img src="assets/logo-white.png" alt="e-Trak | GRYB" class="header-logo">
            </div>
            <div class="lang-switch" style="position:absolute;right:0;">
                <button class="lang-btn" data-lang="fr">FR</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </div>
    </header>

    <main>
        <section class="selector-section">
            <div class="intro-row">
                <span class="section-title" data-i18n="mr.title">Nouvelles machines</span>
            </div>
            <p class="mr-intro" data-i18n="mr.intro">Demandes d'ajout de machines absentes de la base de donnees. Generez la machine ou ajoutez-en une manuellement.</p>

            <div class="mr-card">
                <h2 data-i18n="mr.add_manual">Ajouter une machine manuellement</h2>
                <div class="mr-addrow">
                    <div class="mr-field">
                        <label data-i18n="mr.f_type">Type</label>
                        <select id="mr-type"></select>
                    </div>
                    <div class="mr-field">
                        <label data-i18n="mr.f_fab">Fabricant</label>
                        <input id="mr-fab" type="text" autocomplete="off">
                    </div>
                    <div class="mr-field">
                        <label data-i18n="mr.f_model">Modele</label>
                        <input id="mr-model" type="text" autocomplete="off">
                    </div>
                    <div class="mr-field">
                        <label data-i18n="mr.f_year">Annee</label>
                        <input id="mr-year" type="text" inputmode="numeric" autocomplete="off" style="min-width:90px;">
                    </div>
                    <button id="mr-add-btn" class="mr-btn mr-btn-gen" data-i18n="mr.add_btn">Ajouter cette machine</button>
                </div>
            </div>

            <div class="mr-card">
                <h2><span data-i18n="mr.active_title">Demandes actives</span> <span id="mr-count"></span></h2>
                <div id="mr-table-wrap">
                    <p class="mr-empty" data-i18n="mr.loading">Chargement...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js?v=1"></script>
    <script src="js/translations.js?v=214"></script>
    <script src="js/i18n.js?v=167"></script>
    <script src="js/heartbeat.js?v=5"></script>
    <script src="js/version-check.js?v=2"></script>
    <script src="js/machine-requests.js?v=3"></script>
</body>
</html>
