name: Sync Google Sheet to machines.json

on:
  schedule:
    # Toutes les 10 min. Note: cron GitHub Actions a un delai de scheduling (~3-5 min typique).
    - cron: '*/10 * * * *'
  workflow_dispatch: # bouton "Run workflow" dans GitHub UI

# Empeche execution concurrente (si une run prend trop de temps, on attend)
concurrency:
  group: sync-sheet
  cancel-in-progress: false

permissions:
  contents: write # pour push le commit auto

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Write service account key
        run: |
          mkdir -p /tmp/secrets
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > /tmp/secrets/sa.json
          # Verification basique
          python -c "import json; d=json.load(open('/tmp/secrets/sa.json')); print('SA email:', d['client_email'])"

      - name: Run sync
        env:
          SERVICE_ACCOUNT_KEY_PATH: /tmp/secrets/sa.json
          SHEET_ID: 1yWs8tGu-dtiBdVSjfFdEh5Kxzd7HNarGebk50A5_zT0
        run: python scripts/sync_sheet.py

      - name: Commit and push if changed
        run: |
          git config user.name "Sheet Sync Bot"
          git config user.email "bot@etrak.local"
          git add data/machines.json
          if git diff --staged --quiet; then
            echo "Aucun changement detecte dans machines.json"
          else
            git commit -m "Auto-sync: machines.json from Google Sheet"
            git push
            echo "machines.json mis a jour et pousse"
          fi

      - name: Cleanup
        if: always()
        run: rm -f /tmp/secrets/sa.json
